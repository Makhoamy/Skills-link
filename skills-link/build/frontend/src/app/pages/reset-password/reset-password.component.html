<div class="reset-container">
  <h1>Choose a new password</h1>

  @if (done()) {
    <p class="success-text">{{ message() }}</p>
    <p class="back-link"><a routerLink="/login">Go to Sign in</a></p>
  } @else {
    <form (ngSubmit)="submit()">

      <div class="field">
        <label for="password">New password</label>
        <input id="password" type="password" name="password" [(ngModel)]="password" autocomplete="new-password" required>
        <app-password-strength [password]="password"></app-password-strength>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" name="confirmPassword" [(ngModel)]="confirmPassword" required>
      </div>

      @if (errorMessage()) {
        <p class="error-text">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="loading() || !token">
        {{ loading() ? 'Saving...' : 'Change password' }}
      </button>

    </form>

    <p class="back-link">
      <a routerLink="/forgot-password">Ask for a new link</a>
    </p>
  }
</div>
