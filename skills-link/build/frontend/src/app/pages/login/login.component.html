<h1>Sign in</h1>

<form (ngSubmit)="submit()" style="max-width: 380px;">
  <div class="field">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" [(ngModel)]="email" required>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" type="password" name="password" [(ngModel)]="password" required>
  </div>

  @if (errorMessage()) {
    <p class="error-text">{{ errorMessage() }}</p>
  }
 
<div style="margin-bottom: 15px;">
    <a routerLink="/forgot-password">Forgot Password?</a>
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="loading()">
    {{ loading() ? 'Signing in…' : 'Sign in' }}
  </button>
</form>

<p style="margin-top: 1rem;">Don't have an account? <a routerLink="/signup">Sign up</a></p>
